name: Ruby

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        ruby-version: [ 4, 3.4, 3.3 ]

    name: Ruby ${{ matrix.ruby-version }}

    steps:
      - name: clone ${{ github.repository }}
        uses: actions/checkout@v7
      - name: setup Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - name: run tests
        run: bundle exec rspec
      - name: typecheck
        if: matrix.ruby-version == '3.4'
        run: bundle exec srb tc
      # the fixture supergraph must stay what RouterGraph's subgraphs compose
      # to; needs no network, unlike the Apollo re-composition that only runs
      # by hand (see integration.yml)
      - name: check the demo supergraph is composed
        run: bundle exec ruby bin/federation-diff
      - name: upload code coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
