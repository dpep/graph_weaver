name: Integration

# The :integration specs load on every run but never execute (spec_helper
# filters them out without INTEGRATION), so they rot silently — the gem has
# shipped a broken integration suite twice while CI stayed green. This runs
# the two that need nothing but network; the federation ones need node and
# the GitHub spec needs a token of your own, so they stay manual
# (`make integration`).
#
# Scheduled only: a public endpoint being down must never block a PR. It is
# deliberately NOT continue-on-error — a red nightly is the whole signal.
#
# It is also where examples/github/generated is re-derived. bin/generate
# regenerates it only from a cached dump, so this is the one run holding
# GitHub's live schema — and those files drifted two releases before a reader
# noticed.
#
# The federation job needs no network, only node — it exists because
# Testing::Router's refusal categories are a *claim* about how the local
# router differs from Apollo's, and a claim nothing re-checks becomes a
# record of what someone believed on the day they wrote it. The cost of it
# going stale is the one outcome this library is built to prevent: a test
# that passes on semantics production disagrees with.
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

# nothing here writes; the github example's step only needs a token valid
# enough to introspect api.github.com/graphql
permissions:
  contents: read

jobs:
  public-apis:
    runs-on: ubuntu-latest

    name: countries + pokeapi + the github example

    steps:
      - name: clone ${{ github.repository }}
        uses: actions/checkout@v7
      - name: setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: run network integration specs
        env:
          INTEGRATION: "1"
        run: bundle exec rspec spec/integration/countries_spec.rb spec/integration/pokeapi_spec.rb
      - name: regenerate the github example against the live schema
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bundle exec ruby examples/github/generate.rb
      - name: the checked-in example is still what its queries generate
        run: git diff --exit-code -- examples/github/generated

  federation:
    runs-on: ubuntu-latest

    name: apollo gateway parity

    steps:
      - name: clone ${{ github.repository }}
        uses: actions/checkout@v7
      - name: setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: spec/support/federation/package-lock.json
      - name: install the gateway harness
        run: npm --prefix spec/support/federation ci
      - name: diff the local router against a real @apollo/gateway
        env:
          INTEGRATION: "1"
        run: >
          bundle exec rspec
          spec/integration/router_parity_spec.rb
          spec/integration/federation_spec.rb
          spec/integration/api_schema_spec.rb
